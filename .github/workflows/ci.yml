name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Builds and tests without signing. Signing, notarization and publishing
# happen in the manually dispatched release workflow.
jobs:
  website:
    name: Website SEO checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate website SEO
        run: python3 scripts/test_website_seo.py

  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Unit tests
        run: |
          xcodebuild -project Fuego.xcodeproj -scheme Fuego -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:FuegoTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Release build compiles
        run: |
          xcodebuild -project Fuego.xcodeproj -scheme Fuego -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check release script
        run: bash -n scripts/release.sh
